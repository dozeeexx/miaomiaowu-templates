name: Validate and refresh rules

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *' # 08:30 UTC+8, best effort; GitHub may delay jobs
  push:
    paths:
      - 'templates/**'
      - 'rules/**'
      - 'scripts/**'
      - '*json'
      - '.github/workflows/rules.yml'
  pull_request:
    paths:
      - 'templates/**'
      - 'rules/**'
      - 'scripts/**'
      - '*json'
      - '.github/workflows/rules.yml'

permissions:
  contents: write

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned official Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.19.32 --repo MetaCubeX/mihomo --pattern 'mihomo-linux-amd64-compatible-v1.19.32.gz' --dir "$RUNNER_TEMP/mmw-core"
          gzip -d "$RUNNER_TEMP/mmw-core/mihomo-linux-amd64-compatible-v1.19.32.gz"
          chmod +x "$RUNNER_TEMP/mmw-core/mihomo-linux-amd64-compatible-v1.19.32"
          echo "MIHOMO_BINARY=$RUNNER_TEMP/mmw-core/mihomo-linux-amd64-compatible-v1.19.32" >> "$GITHUB_ENV"
      - name: Validate edits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python3 scripts/check_rules.py
      - name: Refresh and validate staged upstream rules
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/refresh_rules.py
      - name: Commit verified public artifacts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/mihomo rules/compat source-manifest.json sanitization.json routing-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified public rules'
          git push
