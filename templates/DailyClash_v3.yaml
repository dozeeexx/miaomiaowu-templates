# 妙妙屋 V3 日常模板 · 2026-10-04 精简发布版
# FlClash / Clash Verge Rev: 推荐 Mihomo MRS 版。
# Shadowrocket: 使用 Dailyxhj_v3.yaml + t=clash-to-shadowrocket，导入配置订阅。
# 模板不含真实节点。__PROXY_NODES__ 由妙妙屋 V3 注入。
# AI / 加密货币 / Polymarket 首次使用时手动指定合适节点。
# 客户端控制 TUN、系统代理和监听端口；本模板不强制接管它们。
# 规则仓库: https://github.com/dozeeexx/miaomiaowu-templates
# Apple 分组用于 apple-proxy 子集，其他 Apple 和大陆子集保持直连。
# 兼容版转换后，小火箭 DNS 与规则更新时间须在 iOS 端单独验证。
mode: "rule"
log-level: "warning"
allow-lan: false
ipv6: true
tcp-concurrent: true
unified-delay: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: true
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
    - "+.internal"
    - "localhost"
    - "rule-set:domestic"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "captive.apple.com"
  default-nameserver:
    - "223.5.5.5"
    - "119.29.29.29"
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  nameserver:
    - "https://1.1.1.1/dns-query#节点选择"
    - "https://8.8.8.8/dns-query#节点选择"
  nameserver-policy:
    # Play 接口与下载 DNS 跟随 Google，避免 Google 独立选节点后解析出口分离。
    "services.googleapis.cn":
      - "https://1.1.1.1/dns-query#Google"
      - "https://8.8.8.8/dns-query#Google"
    "clientservices.googleapis.com":
      - "https://1.1.1.1/dns-query#Google"
      - "https://8.8.8.8/dns-query#Google"
    "play.googleapis.com":
      - "https://1.1.1.1/dns-query#Google"
      - "https://8.8.8.8/dns-query#Google"
    "play.google.com":
      - "https://1.1.1.1/dns-query#Google"
      - "https://8.8.8.8/dns-query#Google"
    "play-lh.googleusercontent.com":
      - "https://1.1.1.1/dns-query#Google"
      - "https://8.8.8.8/dns-query#Google"
    "+.xn--ngstr-lra8j.com":
      - "https://1.1.1.1/dns-query#Google"
      - "https://8.8.8.8/dns-query#Google"
    "+.gvt1.com":
      - "https://1.1.1.1/dns-query#Google"
      - "https://8.8.8.8/dns-query#Google"
    "rule-set:polymarket":
      - "https://1.1.1.1/dns-query#Polymarket"
      - "https://8.8.8.8/dns-query#Polymarket"
    "rule-set:personal-sites":
      - "https://1.1.1.1/dns-query#自用网站"
      - "https://8.8.8.8/dns-query#自用网站"
    "rule-set:domestic":
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    "rule-set:ai":
      - "https://1.1.1.1/dns-query#AI"
      - "https://8.8.8.8/dns-query#AI"
    "rule-set:crypto":
      - "https://1.1.1.1/dns-query#加密货币"
      - "https://8.8.8.8/dns-query#加密货币"
proxies: null
proxy-groups:
  - name: "节点选择"
    type: "select"
    include-all-proxies: true
    proxies:
      - "自动选择"
      - "__PROXY_NODES__"
  - name: "自动选择"
    type: "url-test"
    include-all-proxies: true
    proxies:
      - "__PROXY_NODES__"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 600
    tolerance: 80
    lazy: true
  - name: "AI"
    type: "select"
    include-all-proxies: true
    proxies:
      - "__PROXY_NODES__"
  - name: "加密货币"
    type: "select"
    include-all-proxies: true
    proxies:
      - "__PROXY_NODES__"
  - name: "Polymarket"
    type: "select"
    include-all-proxies: true
    proxies:
      - "__PROXY_NODES__"
  - name: "自用网站"
    type: "select"
    include-all-proxies: true
    proxies:
      - "节点选择"
      - "DIRECT"
      - "__PROXY_NODES__"
  - name: "Google"
    type: "select"
    include-all-proxies: true
    proxies:
      - "节点选择"
      - "__PROXY_NODES__"
  - name: "YouTube"
    type: "select"
    include-all-proxies: true
    proxies:
      - "节点选择"
      - "__PROXY_NODES__"
  - name: "Telegram"
    type: "select"
    include-all-proxies: true
    proxies:
      - "节点选择"
      - "__PROXY_NODES__"
  - name: "海外社交"
    type: "select"
    include-all-proxies: true
    proxies:
      - "节点选择"
      - "__PROXY_NODES__"
  - name: "GitHub"
    type: "select"
    include-all-proxies: true
    proxies:
      - "节点选择"
      - "__PROXY_NODES__"
  - name: "海外流媒体"
    type: "select"
    include-all-proxies: true
    proxies:
      - "节点选择"
      - "__PROXY_NODES__"
  - name: "TikTok"
    type: "select"
    include-all-proxies: true
    proxies:
      - "节点选择"
      - "__PROXY_NODES__"
  - name: "Spotify"
    type: "select"
    include-all-proxies: true
    proxies:
      - "节点选择"
      - "__PROXY_NODES__"
  - name: "Apple"
    type: "select"
    include-all-proxies: true
    proxies:
      - "节点选择"
      - "DIRECT"
      - "__PROXY_NODES__"
  - name: "兜底"
    type: "select"
    include-all-proxies: true
    proxies:
      - "节点选择"
      - "DIRECT"
      - "__PROXY_NODES__"
